<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}

.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:var(--r);border:none;background:transparent;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.nav-btn.active{background:var(--s2);color:var(--t1);border:1px solid var(--b2)}

.comp-row{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;transition:all .15s;cursor:pointer}
.comp-row:hover{border-color:var(--b2);background:var(--s2)}

.avatar{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}

.seg-tab:hover{border-color:var(--b2);color:var(--t1)}
.seg-tab.active{background:var(--acc2);border-color:var(--b3);color:var(--acc)}
.seg-tab.done{color:var(--grn);border-color:var(--grn2)}
.seg-tab.done.active{background:#0a3328;border-color:var(--grn)}

.seg-tab:disabled{opacity:.35;cursor:default}
.analysis-box{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);padding:20px 24px;font-size:13px;line-height:1.9;color:var(--t1);white-space:pre-wrap;min-height:160px}

.comp-compare-col{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);padding:16px;flex:1;min-width:0}
.comp-compare-col h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.compare-grid{display:flex;gap:10px}
@media(max-width:600px){.compare-grid{flex-direction:column}}
.empty{text-align:center;padding:48px 20px;color:var(--t3)}
.empty i{font-size:40px;display:block;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.pill-blue{background:var(--acc2);color:var(--acc);border:1px solid var(--b2)}
.pill-green{background:var(--grn2);color:var(--grn);border:1px solid #0f4535}
.pill-amber{background:var(--amb2);color:var(--amb);border:1px solid #3d2908}
.score-num{font-size:28px;font-weight:700;line-height:1}
.score-sub{font-size:11px;color:var(--t3);margin-top:2px}
.score-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:12px 16px;text-align:center}
.chart-wrap{position:relative;height:260px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:8px}
.rank-num{font-size:18px;font-weight:700;color:var(--t3);width:28px;text-align:center}
.rank-num.top{color:var(--amb)}
.modal-overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--s1);border:1px solid var(--b2);border-radius:var(--rl);padding:28px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.modal a{color:var(--acc);text-decoration:none}
.hint{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.5}
<\/style>
<\/head>

<div class="app">

<!-- MODAL API KEY -->
<div class="modal-overlay" id="modal-key" style="display:none">
  <div class="modal">
    <h2><i class="ti ti-key"><\/i> Configurar API Key<\/h2>
    <p>Acesse <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com<\/a> para criar sua chave. Ela fica salva apenas no seu navegador.<\/p>
    <div class="field"><label>Anthropic API Key<\/label><input type="password" id="input-apikey" placeholder="sk-ant-..."/><\/div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveApiKey()"><i class="ti ti-check"><\/i> Salvar<\/button><button class="btn btn-ghost" onclick="closeKeyModal()" id="btn-key-cancel">Cancelar<\/button><\/div>
  <\/div>
<\/div>

<!-- MODAL DADOS REAIS -->
<div class="modal-overlay" id="modal-data" style="display:none">
  <div class="modal">
    <h2><i class="ti ti-clipboard-data"><\/i> Dados reais do concorrente<\/h2>
    <p>Cole abaixo o que você vê diretamente nos perfis e site. A IA usará esses dados como fonte primária — resultado muito mais preciso.<\/p>
    <div class="field">
      <label>Instagram — seguidores, posts, bio, handle<\/label>
      <textarea id="fd-instagram" rows="3" placeholder="Ex: @igormelloeu · 70.5K seguidores · 640 posts · 410 seguindo&#10;Bio: Igor Mello | Venda consultiva&#10;Não sou o 01, nem 02, talvez seja o 07..."><\/textarea>
      <div class="hint">Abra o perfil e cole o que aparece: handle, contagens, bio completa.<\/div>
    <\/div>
    <div class="field">
      <label>Site — headline, oferta, preço, CTAs<\/label>
      <textarea id="fd-site" rows="3" placeholder="Ex: Headline: 'Aprenda a fechar qualquer cliente'&#10;CTA: 'Quero ser closer faixa preta'&#10;Preço: R$997 à vista..."><\/textarea>
    <\/div>
    <div class="field">
      <label>Conteúdo recente — temas, formatos, cadência<\/label>
      <textarea id="fd-content" rows="3" placeholder="Ex: Posta ~5x/semana, maioria Reels&#10;Temas: objeções, fechamento, cliente cético, role play de vendas&#10;Engajamento médio: ~2k likes por Reel"><\/textarea>
    <\/div>
    <div class="field">
      <label>Outros dados (funil, YT, preços, depoimentos)<\/label>
      <textarea id="fd-extra" rows="2" placeholder="Ex: Tem curso 'Closer Faixa Preta' R$1.997, grupo VIP no Telegram, YouTube com 10k inscritos..."><\/textarea>
    <\/div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="confirmData()"><i class="ti ti-sparkles"><\/i> Analisar com esses dados<\/button>
      <button class="btn" onclick="skipData()"><i class="ti ti-world-search"><\/i> Só web search<\/button>
      <button class="btn btn-ghost" onclick="document.getElementById('modal-data').style.display='none'">Cancelar<\/button>
    <\/div>
  <\/div>
<\/div>

<div class="topbar">
  <div class="brand"><div class="brand-icon">A<\/div><div><div class="brand-name">Aionix<\/div><div class="brand-sub">Inteligência Competitiva<\/div><\/div><\/div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="key-indicator" onclick="openKeyModal()" style="cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px"><i class="ti ti-key"><\/i><span id="key-indicator-text">Sem chave<\/span><\/div>
    <div class="ver-badge">v3.0<\/div>
  <\/div>
<\/div>

<div class="nav">
  <button class="nav-btn active" id="nav-competitors" onclick="page('competitors')"><i class="ti ti-building-store"><\/i> Concorrentes <span class="cb" id="comp-count-badge">0<\/span><\/button>
  <button class="nav-btn" id="nav-analysis" onclick="page('analysis')" disabled><i class="ti ti-chart-dots"><\/i> Análise<\/button>
  <button class="nav-btn" id="nav-compare" onclick="page('compare')" disabled><i class="ti ti-columns"><\/i> Comparar<\/button>
  <button class="nav-btn" id="nav-ranking" onclick="page('ranking')" disabled><i class="ti ti-trophy"><\/i> Ranking<\/button>
<\/div>

<div id="page-competitors">
  <div class="card">
    <div class="sec-label">Adicionar concorrente<\/div>
    <div class="grid2">
      <div class="field"><label>Nome *<\/label><input id="f-name" placeholder="ex: Igor Mello"\/><\/div>
      <div class="field"><label>Website<\/label><input id="f-website" placeholder="https://..."\/><\/div>
      <div class="field"><label>Instagram<\/label><input id="f-instagram" placeholder="@handle ou URL"\/><\/div>
      <div class="field"><label>Segmento<\/label><input id="f-segment" placeholder="ex: Vendas consultivas"\/><\/div>

    <button class="btn btn-primary" onclick="addComp()"><i class="ti ti-plus"><\/i> Adicionar<\/button>
  <\/div>
  <div style="margin-top:20px"><div class="sec-label">Salvos<\/div><div id="comp-list"><div class="empty"><i class="ti ti-building-store"><\/i>Nenhum concorrente ainda.<\/div><\/div><\/div>
<\/div>

<div id="page-analysis" style="display:none">
  <div id="analysis-select-msg" class="empty" style="padding:24px"><i class="ti ti-arrow-left"><\/i>Selecione um concorrente para analisar.<\/div>
  <div id="analysis-main" style="display:none">
    <div class="section-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" id="a-avatar"><\/div>
        <div><div style="font-size:16px;font-weight:600" id="a-name"><\/div><div id="a-status" class="pill pill-blue" style="margin-top:4px"><i class="ti ti-clock" style="font-size:11px"><\/i> Aguardando<\/div><\/div>
      <\/div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" id="btn-pdf" onclick="exportPDF()" style="display:none"><i class="ti ti-file-type-pdf"><\/i> PDF<\/button>
        <button class="btn btn-sm btn-ghost" onclick="page('competitors')"><i class="ti ti-arrow-left"><\/i> Voltar<\/button>
      <\/div>
    <\/div>
    <div class="card" id="scores-card" style="display:none;margin-bottom:16px">
      <div class="sec-label">Score geral<\/div>
      <div class="grid3" id="score-summary"><\/div>
      <div style="margin-top:16px" id="score-bars"><\/div>
    <\/div>
    <div class="seg-tabs" id="seg-tabs"><\/div>
    <div id="analysis-content"><\/div>
  <\/div>
<\/div>

<div id="page-compare" style="display:none">
  <div class="card" style="margin-bottom:16px">
    <div class="sec-label">Selecione 2–3 concorrentes para comparar<\/div>
    <div id="compare-select-list"><\/div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <select id="compare-section" style="width:auto;flex:1;min-width:160px">
        <option value="social">Presença social<\/option><option value="copy">Copy & site<\/option><option value="funnel">Funil & oferta<\/option><option value="content">Conteúdo & Reels<\/option><option value="audience">Público-alvo<\/option><option value="strategic">Diagnóstico estratégico<\/option>
      <\/select>
      <button class="btn btn-primary" onclick="renderCompare()"><i class="ti ti-columns"><\/i> Comparar<\/button>
    <\/div>
  <\/div>
  <div id="compare-output"><\/div>
<\/div>

<div id="page-ranking" style="display:none">
  <div class="card" style="margin-bottom:16px"><div class="sec-label">Ranking por score total<\/div><div id="ranking-list"><\/div><\/div>
  <div class="card"><div class="sec-label">Comparativo visual<\/div><div class="chart-wrap"><canvas id="ranking-chart"><\/canvas><\/div><\/div>
<\/div>

<script>
var SECTIONS=[{id:"social",label:"Presença social",icon:"ti-brand-instagram"},{id:"copy",label:"Copy & site",icon:"ti-writing"},{id:"funnel",label:"Funil & oferta",icon:"ti-filter"},{id:"content",label:"Conteúdo & Reels",icon:"ti-player-play"},{id:"audience",label:"Público-alvo",icon:"ti-users"},{id:"strategic",label:"Diagnóstico estratégico",icon:"ti-bulb"},{id:"scores",label:"Scores",icon:"ti-chart-radar"}];
var SCORE_DIMS=["Presença social","Copy","Funil","Conteúdo","Público","Posicionamento"];
var PAL=["#4f7cff","#d4537e","#ba7517","#7f77dd","#1d9e75","#d85a30","#2196f3","#9b59b6"];
var PAL_BG=["#1a2d5e22","#4a1b2b22","#2e1e0422","#1e154022","#0a332822","#2a150a22"];
var competitors=[],selected=null,analysisStore={},activeSection="social",rankChart=null;
var pendingId=null,realData={},currentLoadingId=null;

function ls(k,v){if(v===undefined){try{return localStorage.getItem(k);}catch(e){return null;}}try{localStorage.setItem(k,v);}catch(e){}}
function loadStorage(){try{var d=ls("aionix-ci-v3");if(d){var p=JSON.parse(d);competitors=p.competitors||[];analysisStore=p.analysisStore||{};}}catch(e){}}
function saveStorage(){try{ls("aionix-ci-v3",JSON.stringify({competitors,analysisStore}));}catch(e){}}
function getApiKey(){return ls("aionix-api-key")||"";}
function saveApiKey(){var k=document.getElementById("input-apikey").value.trim();if(!k)return;ls("aionix-api-key",k);updateKeyIndicator();closeKeyModal();}
function openKeyModal(){document.getElementById("input-apikey").value=getApiKey();document.getElementById("modal-key").style.display="flex";}
function closeKeyModal(){document.getElementById("modal-key").style.display="none";}
function updateKeyIndicator(){var k=getApiKey();var el=document.getElementById("key-indicator-text");var ind=document.getElementById("key-indicator");if(k){el.textContent="API Key ✓";ind.style.color="var(--grn)";}else{el.textContent="Sem chave";ind.style.color="var(--red)";}}

function page(p){["competitors","analysis","compare","ranking"].forEach(function(n){document.getElementById("page-"+n).style.display=n===p?"block":"none";var btn=document.getElementById("nav-"+n);if(btn)btn.classList.toggle("active",n===p);});if(p==="compare")renderCompareSelect();if(p==="ranking")renderRanking();}

function addComp(){var name=document.getElementById("f-name").value.trim();if(!name)return;competitors.push({id:Date.now(),name,website:document.getElementById("f-website").value.trim(),instagram:document.getElementById("f-instagram").value.trim(),segment:document.getElementById("f-segment").value.trim(),extra:document.getElementById("f-extra").value.trim()});["f-name","f-website","f-instagram","f-segment","f-extra"].forEach(function(id){document.getElementById(id).value="";});saveStorage();renderCompList();}
function deleteComp(id){competitors=competitors.filter(function(c){return c.id!==id;});if(selected&&selected.id===id)selected=null;delete analysisStore[id];saveStorage();renderCompList();updateNavState();}
function getScore(cid){var d=analysisStore[cid];if(!d||!d.scores)return 0;var v=SCORE_DIMS.map(function(k){return d.scores[k]||0;});return v.reduce(function(a,b){return a+b;},0)/v.length;}

function renderCompList(){
  var el=document.getElementById("comp-list");
  document.getElementById("comp-count-badge").textContent=competitors.length;
  if(!competitors.length){el.innerHTML='<div class="empty"><i class="ti ti-building-store"><\/i>Nenhum concorrente ainda.<\/div>';return;}
  el.innerHTML=competitors.map(function(c,i){
    var hasData=analysisStore[c.id]&&Object.keys(analysisStore[c.id]).length>0;
    var score=getScore(c.id);
    return '<div class="comp-row'+(selected&&selected.id===c.id?" selected":"")+'" onclick="selectComp('+c.id+')">'+
      '<div style="display:flex;align-items:center;gap:12px"><div class="avatar" style="background:'+PAL_BG[i%PAL.length]+';color:'+PAL[i%PAL.length]+'">'+c.name[0].toUpperCase()+'<\/div>'+
      '<div><div style="font-size:13px;font-weight:600">'+c.name+'<\/div><div class="row-meta">'+(c.segment||c.website||"sem segmento")+'<\/div><\/div><\/div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
      (score>0?'<div class="pill pill-blue" style="font-size:12px;font-weight:700">'+score.toFixed(1)+'<\/div>':'')+
      (hasData?'<div class="pill pill-green"><i class="ti ti-check" style="font-size:10px"><\/i> Analisado<\/div>':'')+
      '<div class="row-actions"><button class="btn btn-sm" onclick="event.stopPropagation();startAnalysis('+c.id+')"><i class="ti ti-sparkles"><\/i> Analisar<\/button>'+
      '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteComp('+c.id+')"><i class="ti ti-trash"><\/i><\/button><\/div><\/div><\/div>';
  }).join("");
}

function selectComp(id){var c=competitors.find(function(x){return x.id===id;});if(!c)return;selected=c;renderCompList();if(analysisStore[id]&&Object.keys(analysisStore[id]).length>0){loadAnalysisView(id);updateNavState();page("analysis");}}
function updateNavState(){var any=competitors.some(function(c){return analysisStore[c.id]&&Object.keys(analysisStore[c.id]).length>0;});document.getElementById("nav-analysis").disabled=!selected;document.getElementById("nav-compare").disabled=!any;document.getElementById("nav-ranking").disabled=!any;}

function startAnalysis(id){
  if(!getApiKey()){openKeyModal();return;}
  pendingId=id;
  ["fd-instagram","fd-site","fd-content","fd-extra"].forEach(function(f){document.getElementById(f).value="";});
  document.getElementById("modal-data").style.display="flex";
}
function confirmData(){
  realData={instagram:document.getElementById("fd-instagram").value.trim(),site:document.getElementById("fd-site").value.trim(),content:document.getElementById("fd-content").value.trim(),extra:document.getElementById("fd-extra").value.trim()};
  document.getElementById("modal-data").style.display="none";
  runAnalysis(pendingId);
}
function skipData(){realData={};document.getElementById("modal-data").style.display="none";runAnalysis(pendingId);}

function buildPrompt(section,comp){
  var name=comp.name;
  var rd="";
  if(realData&&(realData.instagram||realData.site||realData.content||realData.extra)){
    rd="\n\n=== DADOS REAIS COLETADOS DIRETAMENTE (FONTE PRIMÁRIA — use estes, não invente outros) ===";
    if(realData.instagram)rd+="\nINSTAGRAM REAL: "+realData.instagram;
    if(realData.site)rd+="\nSITE REAL: "+realData.site;
    if(realData.content)rd+="\nCONTEÚDO REAL: "+realData.content;
    if(realData.extra)rd+="\nOUTROS DADOS REAIS: "+realData.extra;
    rd+="\n=== USE APENAS ESSES DADOS. NÃO SUBSTITUA POR RESULTADOS DE BUSCA SE OS DADOS REAIS ESTIVEREM DISPONÍVEIS. ===";
  }
  var ctx="CONCORRENTE: "+name+(comp.website?"\nSite: "+comp.website:"")+(comp.instagram?"\nInstagram: "+comp.instagram:"")+(comp.segment?"\nSegmento: "+comp.segment:"")+(comp.extra?"\nContexto: "+comp.extra:"")+rd;
  var ps={
    social:ctx+"\n\nAnalise a presença social de "+name+". "+(realData&&realData.instagram?"USE OS DADOS REAIS DO INSTAGRAM ACIMA como base. Não busque outros números.":"Busque o perfil no Instagram de "+name+".")+"\n\nResponda em português com bullet points:\n• Seguidores (número exato se disponível)\n• Posts e seguindo\n• Bio completa e posicionamento\n• Tom de voz e identidade\n• Tipos de conteúdo dominantes\n• Frequência estimada de posts\n• Engajamento estimado\n• Estética do feed",
    copy:ctx+"\n\nAnalise a copy e site de "+name+". "+(realData&&realData.site?"USE OS DADOS REAIS DO SITE ACIMA.":"Acesse "+(comp.website||"o site de "+name)+".")+"\n\nResponda em português com bullet points:\n• Headline principal\n• Proposta de valor central\n• Principais argumentos de venda\n• Tom de voz\n• CTAs presentes\n• Prova social (depoimentos, números, logos)\n• Clareza e qualidade da oferta",
    funnel:ctx+"\n\nAnalise o funil de vendas de "+name+". Busque o site e conteúdo.\n\nResponda em português com bullet points:\n• Como o lead descobre (orgânico/anúncio/SEO)\n• Isca digital se houver\n• Mecanismo de nutrição\n• Oferta principal e preço se visível\n• Garantias oferecidas\n• Mecanismo de fechamento (call/formulário/WhatsApp/DM)",
    content:ctx+"\n\nAnalise a estratégia de conteúdo de "+name+". "+(realData&&realData.content?"USE OS DADOS REAIS DE CONTEÚDO ACIMA.":"Busque '"+name+" Reels' e '"+name+" YouTube'.")+"\n\nResponda em português com bullet points:\n• Volume de Reels/vídeos\n• Cadência de postagem\n• Formatos dominantes\n• Temas recorrentes\n• Engajamento médio estimado\n• Qualidade de produção (baixa/média/alta)",
    audience:ctx+"\n\nIdentifique o público-alvo de "+name+".\n\nResponda em português com bullet points:\n• Perfil demográfico do cliente ideal\n• Setor e nicho específico\n• Principal dor ou problema resolvido\n• Linguagem e tom usados para se comunicar\n• Nível de consciência do público\n• Transformação prometida",
    strategic:ctx+"\n\nDiagnóstico estratégico de "+name+" para a Aionix (agência de geração de demanda para brasileiros na Austrália).\n\nResponda em português em três blocos:\n\n**PONTOS FORTES DE "+name.toUpperCase()+"**\nO que fazem excepcionalmente bem. Seja específico.\n\n**PONTOS FRACOS DE "+name.toUpperCase()+"**\nLacunas reais observadas. Onde são vulneráveis.\n\n**OPORTUNIDADES CONCRETAS PARA A AIONIX**\nAções específicas e acionáveis para se diferenciar e superar "+name+" no mercado brasileiro na Austrália.",
    scores:"Baseado nos dados de "+name+(realData&&(realData.instagram||realData.site)?", incluindo os dados reais fornecidos,":",")+", atribua scores de 0 a 10. Critério: 10=referência absoluta do mercado, 7=bom, 5=mediano, 3=fraco.\n\nDimensões: "+SCORE_DIMS.join(", ")+"\n\nResponda APENAS com JSON puro sem markdown:\n{\"Presença social\":0,\"Copy\":0,\"Funil\":0,\"Conteúdo\":0,\"Público\":0,\"Posicionamento\":0}"
  };
  return ps[section]||ctx;
}

async function runAnalysis(id){
  var apiKey=getApiKey();if(!apiKey){openKeyModal();return;}
  var comp=competitors.find(function(c){return c.id===id;});if(!comp)return;
  selected=comp;if(!analysisStore[id])analysisStore[id]={};currentLoadingId=id;
  document.getElementById("nav-analysis").disabled=false;
  page("analysis");
  document.getElementById("analysis-select-msg").style.display="none";
  document.getElementById("analysis-main").style.display="block";
  var idx=competitors.findIndex(function(c){return c.id===id;});
  var av=document.getElementById("a-avatar");
  av.textContent=comp.name[0].toUpperCase();av.style.background=PAL_BG[idx%PAL.length];av.style.color=PAL[idx%PAL.length];
  document.getElementById("a-name").textContent=comp.name;
  document.getElementById("scores-card").style.display="none";
  document.getElementById("btn-pdf").style.display="none";
  activeSection="social";setStatus("loading","Iniciando análise...");renderSegTabs(null);

  for(var i=0;i<SECTIONS.length;i++){
    var sec=SECTIONS[i];if(currentLoadingId!==id)return;
    setStatus("loading","Analisando: "+sec.label+" ("+(i+1)+"/"+SECTIONS.length+")");renderSegTabs(sec.id);
    var attempt=0,success=false;
    while(attempt<3&&!success){
      if(attempt>0){setStatus("loading","Rate limit — aguardando 25s... (tentativa "+(attempt+1)+")");await sleep(25000);}
      try{
        var res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
            tools:[{type:"web_search_20250305",name:"web_search"}],
            messages:[{role:"user",content:buildPrompt(sec.id,comp)}]})});
        var data=await res.json();
        if(data.error&&data.error.type==="rate_limit_error"){attempt++;continue;}
        if(data.error)throw new Error(data.error.message);
        if(sec.id==="scores"){
          var tb=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
          try{analysisStore[id].scores=JSON.parse(tb.replace(/```json|```/g,"").trim());}catch(e){analysisStore[id].scores={};}
        }else{
          analysisStore[id][sec.id]=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("")||"Sem dados.";
        }
        success=true;
      }catch(e){if(sec.id!=="scores")analysisStore[id][sec.id]="Erro: "+e.message;success=true;}
    }
    if(!success&&sec.id!=="scores")analysisStore[id][sec.id]="Rate limit persistente. Tente novamente em 1 min.";
    saveStorage();if(activeSection===sec.id)renderContent();
    if(i<SECTIONS.length-1)await sleep(5000);
  }
  setStatus("done","Análise completa");
  document.getElementById("btn-pdf").style.display="inline-flex";
  document.getElementById("scores-card").style.display="block";
  renderSegTabs(null);renderScoresSummary(id);renderContent();updateNavState();
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function setStatus(type,msg){var el=document.getElementById("a-status");if(!el)return;var cls=type==="done"?"pill-green":type==="loading"?"pill-amber":"pill-blue";var icon=type==="done"?"ti-check":type==="loading"?"ti-loader":"ti-clock";el.className="pill "+cls;el.innerHTML='<i class="ti '+icon+'" style="font-size:11px"><\/i> '+msg;}

function renderSegTabs(loadingId){
  var id=selected?selected.id:null;var d=id&&analysisStore[id]?analysisStore[id]:{};
  document.getElementById("seg-tabs").innerHTML=SECTIONS.filter(function(s){return s.id!=="scores";}).map(function(s){
    var isDone=!!d[s.id];var isBusy=s.id===loadingId;var isActive=s.id===activeSection;
    var cls="seg-tab"+(isActive?" active":"")+(isDone?" done":"")+(isBusy?" busy":"");
    var icon=isDone?"ti-check":isBusy?"ti-loader":s.icon;
    return '<button class="'+cls+'" onclick="setSection(\''+s.id+'\')" '+((!isDone&&!isBusy)?"disabled":"")+'>'+
      '<i class="ti '+icon+'"><\/i>'+s.label+'<\/button>';
  }).join("")+(d.scores?'<button class="seg-tab'+(activeSection==="scores"?" active done":"")+' done" onclick="setSection(\'scores\')"><i class="ti ti-chart-radar"><\/i>Scores<\/button>':'');
}

function setSection(id){activeSection=id;renderSegTabs(null);renderContent();}
function renderContent(){
  var el=document.getElementById("analysis-content");
  if(activeSection==="scores"){renderScoresSummary(selected?selected.id:null);el.innerHTML="";return;}
  var id=selected?selected.id:null;var text=id&&analysisStore[id]?analysisStore[id][activeSection]:null;
  if(!text){el.innerHTML='<div class="empty"><i class="ti ti-sparkles"><\/i>Seção ainda sendo analisada...<\/div>';return;}
  var fmt=text.replace(/\*\*(.*?)\*\*/g,"<strong>$1<\/strong>").replace(/\*(.*?)\*/g,"<em>$1<\/em>").replace(/^#{1,3}\s(.+)$/gm,"<strong>$1<\/strong>");
  el.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-sm" onclick="exportSectionPDF()"><i class="ti ti-download"><\/i> Exportar seção<\/button><\/div><div class="analysis-box">'+fmt+'<\/div>';
}

function renderScoresSummary(compId){
  var d=compId&&analysisStore[compId]?analysisStore[compId]:{};var scores=d.scores||{};var total=getScore(compId);
  var card=document.getElementById("scores-card");if(!compId||!d.scores){card.style.display="none";return;}
  card.style.display="block";
  document.getElementById("score-summary").innerHTML=
    '<div class="score-card"><div class="score-num">'+total.toFixed(1)+'<\/div><div class="score-sub">Score geral<\/div><\/div>'+
    '<div class="score-card"><div class="score-num" style="color:var(--grn)">'+Math.max(...SCORE_DIMS.map(function(k){return scores[k]||0;})).toFixed(0)+'<\/div><div class="score-sub">Melhor dimensão<\/div><\/div>'+
    '<div class="score-card"><div class="score-num" style="color:var(--red)">'+Math.min(...SCORE_DIMS.map(function(k){return scores[k]||0;})).toFixed(0)+'<\/div><div class="score-sub">Pior dimensão<\/div><\/div>';
  document.getElementById("score-bars").innerHTML=SCORE_DIMS.map(function(k){
    var v=scores[k]||0;var color=v>=7?"var(--grn)":v>=5?"var(--amb)":"var(--red)";
    return '<div class="score-bar-wrap"><div class="score-label-row"><span>'+k+'<\/span><span style="color:var(--t1);font-weight:600">'+v+'<\/span><\/div>'+
      '<div class="score-bar"><div class="score-bar-fill" style="width:'+(v*10)+'%;background:'+color+'"><\/div><\/div><\/div>';
  }).join("");
}

function loadAnalysisView(id){
  var comp=competitors.find(function(c){return c.id===id;});if(!comp)return;
  var idx=competitors.findIndex(function(c){return c.id===id;});
  document.getElementById("analysis-select-msg").style.display="none";
  document.getElementById("analysis-main").style.display="block";
  var av=document.getElementById("a-avatar");av.textContent=comp.name[0].toUpperCase();av.style.background=PAL_BG[idx%PAL.length];av.style.color=PAL[idx%PAL.length];
  document.getElementById("a-name").textContent=comp.name;
  var d=analysisStore[id]||{};var done=Object.keys(d).length>=SECTIONS.length;
  setStatus(done?"done":"loading",done?"Análise completa":"Análise parcial");
  document.getElementById("btn-pdf").style.display=done?"inline-flex":"none";
  activeSection="social";renderSegTabs(null);renderContent();renderScoresSummary(id);
}

function renderCompareSelect(){
  var el=document.getElementById("compare-select-list");
  if(!competitors.length){el.innerHTML='<div class="empty" style="padding:16px"><i class="ti ti-building-store"><\/i>Adicione concorrentes primeiro.<\/div>';return;}
  el.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:8px">'+competitors.map(function(c,i){
    return '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:8px 12px;font-size:13px">'+
      '<input type="checkbox" data-id="'+c.id+'" style="width:auto;accent-color:var(--acc)"\/>'+
      '<div class="avatar" style="width:24px;height:24px;font-size:11px;border-radius:6px;background:'+PAL_BG[i%PAL.length]+';color:'+PAL[i%PAL.length]+'">'+c.name[0].toUpperCase()+'<\/div> '+c.name+'<\/label>';
  }).join("")+'<\/div>';
}
function renderCompare(){
  var checks=document.querySelectorAll("#compare-select-list input:checked");
  var ids=Array.from(checks).map(function(x){return parseInt(x.dataset.id);});
  var sec=document.getElementById("compare-section").value;
  var secLabel=SECTIONS.find(function(s){return s.id===sec;});
  if(ids.length<2){document.getElementById("compare-output").innerHTML='<div class="empty"><i class="ti ti-info-circle"><\/i>Selecione ao menos 2.<\/div>';return;}
  var cols=ids.map(function(id){
    var c=competitors.find(function(x){return x.id===id;});var ci=competitors.findIndex(function(x){return x.id===id;});
    var text=(analysisStore[id]||{})[sec]||"Análise não disponível.";
    var fmt=text.replace(/\*\*(.*?)\*\*/g,"<strong>$1<\/strong>").replace(/\*(.*?)\*/g,"<em>$1<\/em>");
    return '<div class="comp-compare-col"><h3><div class="avatar" style="width:24px;height:24px;font-size:11px;border-radius:6px;background:'+PAL_BG[ci%PAL.length]+';color:'+PAL[ci%PAL.length]+'">'+c.name[0].toUpperCase()+'<\/div>'+c.name+'<\/h3><div class="analysis-box" style="min-height:120px;font-size:12px;line-height:1.8">'+fmt+'<\/div><\/div>';
  }).join("");
  document.getElementById("compare-output").innerHTML='<div style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:600">'+(secLabel?secLabel.label:sec)+'<\/div><div class="compare-grid">'+cols+'<\/div>';
}

function renderRanking(){
  var ws=competitors.filter(function(c){return analysisStore[c.id]&&analysisStore[c.id].scores;});
  ws.sort(function(a,b){return getScore(b.id)-getScore(a.id);});
  var el=document.getElementById("ranking-list");
  if(!ws.length){el.innerHTML='<div class="empty" style="padding:16px"><i class="ti ti-trophy"><\/i>Nenhum com scores ainda.<\/div>';return;}
  el.innerHTML=ws.map(function(c,i){
    var idx=competitors.findIndex(function(x){return x.id===c.id;});var score=getScore(c.id);var color=score>=7?"var(--grn)":score>=5?"var(--amb)":"var(--red)";
    return '<div class="rank-row"><div class="rank-num'+(i===0?" top":"")+'>'+(i+1)+'<\/div>'+
      '<div class="avatar" style="background:'+PAL_BG[idx%PAL.length]+';color:'+PAL[idx%PAL.length]+'">'+c.name[0].toUpperCase()+'<\/div>'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:600">'+c.name+'<\/div><div class="row-meta">'+(c.segment||c.website||"")+'<\/div><\/div>'+
      '<div style="font-size:22px;font-weight:700;color:'+color+'">'+score.toFixed(1)+'<\/div><\/div>';
  }).join("");
  var ctx=document.getElementById("ranking-chart");
  if(rankChart)rankChart.destroy();
  rankChart=new Chart(ctx,{type:"bar",data:{labels:ws.map(function(c){return c.name;}),datasets:SCORE_DIMS.map(function(dim,di){return{label:dim,data:ws.map(function(c){return(analysisStore[c.id].scores||{})[dim]||0;}),backgroundColor:PAL[di%PAL.length]+"aa",borderColor:PAL[di%PAL.length],borderWidth:1};})},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b93b0",font:{size:11}}}},scales:{x:{ticks:{color:"#8b93b0"},grid:{color:"#252c3d"}},y:{min:0,max:10,ticks:{color:"#8b93b0"},grid:{color:"#252c3d"}}}}});
}

function buildPrintHTML(comp,sections,data,score){
  var secHTML=sections.map(function(sec){var text=data[sec.id]||"";if(!text)return"";var fmt=text.replace(/\*\*(.*?)\*\*/g,"<strong>$1<\/strong>").replace(/\*(.*?)\*/g,"<em>$1<\/em>").replace(/\n/g,"<br>");return'<div class="section"><div class="sec-title">'+sec.label+'<\/div><div class="sec-body">'+fmt+'<\/div><\/div>';}).join("");
  var scoreHTML="";
  if(score>0&&data.scores){var dims=SCORE_DIMS.map(function(k){var v=data.scores[k]||0;var color=v>=7?"#22c98a":v>=5?"#e09c2a":"#e85555";return'<div class="score-dim"><span>'+k+'<\/span><span style="color:'+color+';font-weight:700">'+v+'\/10<\/span><\/div>';}).join("");scoreHTML='<div class="section"><div class="sec-title">Scores<\/div><div class="scores-grid">'+dims+'<\/div><\/div>';}
  return'<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Aionix — '+comp.name+'<\/title><style>body{font-family:Helvetica,Arial,sans-serif;background:#fff;color:#1a1a2e;margin:0;padding:0}.cover{background:#0d1117;color:#fff;padding:48px 40px;page-break-after:always}.cover .eyebrow{font-size:11px;color:#4f7cff;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.cover h1{font-size:32px;font-weight:700;margin:0 0 8px}.cover .sub{font-size:13px;color:#8b93b0}.cover .score-badge{display:inline-block;background:#1a2d5e;color:#4f7cff;border-radius:8px;padding:8px 20px;font-size:18px;font-weight:700;margin-top:20px}.content{padding:32px 40px}.section{margin-bottom:32px;page-break-inside:avoid}.sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4f7cff;border-bottom:2px solid #e8eaf0;padding-bottom:6px;margin-bottom:14px}.sec-body{font-size:13px;line-height:1.8;color:#2a2a3e}.scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score-dim{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;background:#f5f5fa;border-radius:6px}.footer{margin-top:40px;font-size:10px;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:12px}@media print{@page{margin:15mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}<\/style><\/head><body>'+
    '<div class="cover"><div class="eyebrow">Aionix · Inteligência Competitiva<\/div><h1>'+comp.name+'<\/h1><div class="sub">Análise completa · '+new Date().toLocaleDateString("pt-BR")+'<\/div>'+(score>0?'<div class="score-badge">Score geral: '+score.toFixed(1)+'\/10<\/div>':'')+'<\/div>'+
    '<div class="content">'+scoreHTML+secHTML+'<div class="footer">Gerado por Aionix · aionix.com.au<\/div><\/div><\/body><\/html>';
}
function exportSectionPDF(){var comp=selected;var sec=SECTIONS.find(function(s){return s.id===activeSection;});if(!comp||!sec)return;var w=window.open("","_blank","width=900,height=700");w.document.write(buildPrintHTML(comp,[sec],analysisStore[comp.id]||{},0));w.document.close();w.onload=function(){w.print();};}
function exportPDF(){var comp=selected;if(!comp)return;var data=analysisStore[comp.id]||{};var score=getScore(comp.id);var secs=SECTIONS.filter(function(s){return s.id!=="scores"&&data[s.id];});var w=window.open("","_blank","width=900,height=700");w.document.write(buildPrintHTML(comp,secs,data,score));w.document.close();w.onload=function(){w.print();};}

loadStorage();renderCompList();updateNavState();updateKeyIndicator();
if(!getApiKey())setTimeout(openKeyModal,600);
